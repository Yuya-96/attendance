<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="meiko.png" rel="icon" type="image/png">
<link href="meiko.png" rel="apple-touch-icon">
<link href="style.css" rel="stylesheet">
<title>給与単価設定</title>
<style>
.rate-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}.rate-form label{display:flex;flex-direction:column;gap:6px}.rate-form input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.rate-table-wrap{overflow-x:auto}.rate-table{width:100%;border-collapse:collapse}.rate-table th,.rate-table td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}.rate-actions{display:flex;gap:8px;flex-wrap:wrap}.rate-note{color:#64748b;font-size:13px;line-height:1.7}.rate-btn{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}.rate-btn.secondary{background:#e2e8f0;color:#334155}.rate-btn.danger{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<aside class="sidebar"><div class="brand"><span class="brand-mark"><img src="meiko.ico" alt="ロゴ"></span>出退勤システム</div><div class="nav-label">WORKSPACE</div><a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>ホーム</a><a class="nav-link" href="input.html"><span class="nav-icon">＋</span>打刻入力</a><a class="nav-link" href="list.html"><span class="nav-icon">▦</span>勤怠一覧</a><a class="nav-link" href="salary.html"><span class="nav-icon">◈</span>給与確認</a><a class="nav-link active" href="rates.html"><span class="nav-icon">¥</span>給与単価設定</a><div class="sidebar-foot">ATTENDANCE SYSTEM<br>Personal workspace</div></aside>
<div class="app-main"><header class="topbar"><div class="topbar-title">給与単価設定</div><div class="topbar-date" id="today"></div></header><main class="content"><div class="eyebrow">WORKSPACE</div><h1>給与単価設定</h1><p class="subtitle">適用開始日ごとに単価を登録し、過去の履歴も確認できます。</p><div class="panel">
<h2 id="form-title">新しい単価を登録</h2>
<form id="rate-form"><div class="rate-form"><label>適用開始日<input id="start-date" type="date" required></label><label>コマ給（円）<input id="period-rate" type="number" min="0" step="0.01" required></label><label>事務時給（円）<input id="office-rate" type="number" min="0" step="0.01" required></label></div><p class="rate-note">1日6コマ勤務の場合は、超過給与を含めて計算します。適用終了日は次の単価の適用開始日前日として自動決定します。</p><button class="rate-btn" type="submit" id="save-btn">単価を登録</button> <button class="rate-btn secondary" type="button" id="cancel-btn" hidden>編集をキャンセル</button></form>
<h2 style="margin-top:30px">単価履歴</h2><div class="rate-table-wrap"><table class="rate-table"><thead><tr><th>適用期間</th><th>コマ給</th><th>超過給</th><th>事務時給</th><th>操作</th></tr></thead><tbody id="rates-body"></tbody></table></div><p class="rate-note">※単価を編集・削除すると、その期間の給与集計も再計算されます。最初の適用開始日より前の勤務には単価が適用されません。</p><p><a href="salary.html">給与確認に戻る</a></p>
</div></main></div>
<script>
const KEY='salaryRates';
const defaultRates=[{startDate:'2000-01-01',periodRate:2183,officeHourlyRate:1080}];
const yen=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2})+'円';
const readRates=()=>JSON.parse(localStorage.getItem(KEY)||'null')||defaultRates;
const writeRates=r=>localStorage.setItem(KEY,JSON.stringify(r.sort((a,b)=>a.startDate.localeCompare(b.startDate))));
const form=document.getElementById('rate-form'),body=document.getElementById('rates-body');
let editingStart=null;
function dayBefore(iso){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function resetForm(){editingStart=null;form.reset();document.getElementById('form-title').textContent='新しい単価を登録';document.getElementById('save-btn').textContent='単価を登録';document.getElementById('cancel-btn').hidden=true}
function render(){const rates=readRates().sort((a,b)=>a.startDate.localeCompare(b.startDate));body.replaceChildren();rates.forEach((rate,i)=>{const tr=document.createElement('tr');const cells=[rate.startDate+' 〜 '+(rates[i+1]?dayBefore(rates[i+1].startDate):'現在'),yen(rate.periodRate),yen(rate.periodRate*1.25),yen(rate.officeHourlyRate)];cells.forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td)});const action=document.createElement('td');action.className='rate-actions';const edit=document.createElement('button');edit.className='rate-btn secondary';edit.textContent='編集';edit.onclick=()=>{editingStart=rate.startDate;document.getElementById('start-date').value=rate.startDate;document.getElementById('period-rate').value=rate.periodRate;document.getElementById('office-rate').value=rate.officeHourlyRate;document.getElementById('form-title').textContent='単価を編集';document.getElementById('save-btn').textContent='変更を保存';document.getElementById('cancel-btn').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='rate-btn danger';del.textContent='削除';del.onclick=()=>{if(!confirm('この単価を削除しますか？ 対象期間の給与計算が変わる可能性があります。'))return;writeRates(readRates().filter(r=>r.startDate!==rate.startDate));resetForm();render()};action.append(edit,del);tr.appendChild(action);body.appendChild(tr)})}
form.addEventListener('submit',e=>{e.preventDefault();const startDate=document.getElementById('start-date').value,periodRate=Number(document.getElementById('period-rate').value),officeHourlyRate=Number(document.getElementById('office-rate').value);if(!startDate||![periodRate,officeHourlyRate].every(n=>Number.isFinite(n)&&n>=0))return;let rates=readRates();if(rates.some(r=>r.startDate===startDate&&r.startDate!==editingStart)){alert('この適用開始日はすでに登録されています。');return}if(editingStart!==null){if(!confirm('単価を変更しますか？ 過去の給与も再計算されます。'))return;rates=rates.filter(r=>r.startDate!==editingStart)}rates.push({startDate,periodRate,officeHourlyRate});writeRates(rates);resetForm();render()});
document.getElementById('cancel-btn').onclick=resetForm;
document.getElementById('today').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
render();
</script>
</body></html>
