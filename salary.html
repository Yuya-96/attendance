<!DOCTYPE html>
<html lang="ja">
<head>
<link href="meiko.png" rel="icon" type="image/png">
<link href="meiko.png" rel="apple-touch-icon">
<meta charset="utf-8">
<title>給与確認</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="style.css" rel="stylesheet">
<style>.rate-summary{margin:14px 0 22px;padding:16px;border:1px solid #dbeafe;border-radius:10px;background:#f8fbff}.rate-summary p{margin:6px 0}.rate-hint{font-size:13px;color:#64748b}.rate-summary a{display:inline-block;margin-top:8px}.salary-table-wrap{overflow-x:auto}</style>
</head>
<body>
<aside class="sidebar"><div class="brand"><span class="brand-mark"><img src="meiko.ico" alt="ロゴ"></span>出退勤システム</div><div class="nav-label">WORKSPACE</div><a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>ホーム</a><a class="nav-link" href="input.html"><span class="nav-icon">＋</span>打刻入力</a><a class="nav-link" href="list.html"><span class="nav-icon">▦</span>勤怠一覧</a><a class="nav-link active" href="salary.html"><span class="nav-icon">◈</span>給与確認</a><a class="nav-link" href="rates.html"><span class="nav-icon">¥</span>給与単価設定</a><div class="sidebar-foot">ATTENDANCE SYSTEM<br>Personal workspace</div></aside>
<div class="app-main"><header class="topbar"><div class="topbar-title">給与確認</div><div class="topbar-date" id="today"></div></header><main class="content"><div class="eyebrow">WORKSPACE</div><h1>給与確認</h1><p class="subtitle">給与の集計と内訳を確認できます。</p><div class="panel">
<div class="rate-summary"><h2>現在の給与単価</h2><div id="current-rate"></div><a href="rates.html">給与単価を設定・履歴を確認 →</a></div>
<h2>総支給額（全期間）</h2><div id="total-salary-display"></div>
<label>年を選択: <select id="year-select"></select></label>
<div id="month-picker"></div><div id="salary-display"></div>
<h2>特別給理由</h2><div id="special-reasons-list"></div>
<br><a href="index.html">メニューに戻る</a>
</div></main></div>
<script>
const monthPicker=document.getElementById('month-picker');
const display=document.getElementById('salary-display');
const specialReasonsList=document.getElementById('special-reasons-list');
const yearSelect=document.getElementById('year-select');
const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const defaultRates=[{startDate:'2000-01-01',periodRate:2183,officeHourlyRate:1080}];
const yen=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2})+'円';
const getRates=()=> (JSON.parse(localStorage.getItem('salaryRates')||'null')||defaultRates).sort((a,b)=>a.startDate.localeCompare(b.startDate));
const getData=()=>JSON.parse(localStorage.getItem('attendance')||'[]');
function rateFor(date){return getRates().filter(rate=>rate.startDate<=date).at(-1)||null}
function calculateRow(row){const rate=rateFor(row.date);const periods=(row.periods||[]).length;const minutes=Number(row.officeMinutes)||0;const special=Number(row.specialAmount)||0;if(!rate)return {periods,minutes,special,total:special,missing:true};const periodPay=periods*rate.periodRate+(periods===6?rate.periodRate*0.25:0);const officePay=minutes/60*rate.officeHourlyRate;return {periods,minutes,special,total:periodPay+officePay+special,missing:false}}
function summarize(rows){return rows.reduce((acc,row)=>{const result=calculateRow(row);acc.periods+=result.periods;acc.minutes+=result.minutes;acc.special+=result.special;acc.total+=result.total;if(result.missing)acc.missing++;return acc},{periods:0,minutes:0,special:0,total:0,missing:0})}
function getYearsWithData(){return [...new Set(getData().map(row=>row.date.split('-')[0]))].sort()}
function updateYearSelect(){const years=getYearsWithData();yearSelect.replaceChildren();years.forEach(year=>{const option=document.createElement('option');option.value=year;option.textContent=year;yearSelect.appendChild(option)});if(years.includes(String(new Date().getFullYear())))yearSelect.value=String(new Date().getFullYear());renderMonthPicker()}
function renderMonthPicker(){const selectedYear=yearSelect.value;monthPicker.replaceChildren();if(!selectedYear)return;const table=document.createElement('table');const header=document.createElement('thead');header.innerHTML=`<tr><th colspan="3">${selectedYear}</th></tr>`;table.appendChild(header);const tbodyPicker=document.createElement('tbody');for(let i=0;i<4;i++){const row=document.createElement('tr');for(let j=0;j<3;j++){const m=i*3+j;const cell=document.createElement('td');cell.className='month';cell.textContent=months[m];cell.dataset.value=`${selectedYear}-${String(m+1).padStart(2,'0')}`;cell.onclick=()=>showSalary(cell.dataset.value);row.appendChild(cell)}tbodyPicker.appendChild(row)}table.appendChild(tbodyPicker);monthPicker.appendChild(table)}
function showSalary(month){const filtered=getData().filter(row=>row.date.startsWith(month));const result=summarize(filtered);display.innerHTML=`<div class="salary-table-wrap"><table><thead><tr><th>出勤コマ</th><th>事務時間（分）</th><th>給与</th></tr></thead><tbody><tr><td>${result.periods}</td><td>${result.minutes}</td><td>${yen(result.total)}</td></tr></tbody></table></div>${result.missing?`<p class="rate-hint">※単価未設定の日が${result.missing}件あります。該当日の通常給・事務給は計算に含まれていません。</p>`:''}`;specialReasonsList.replaceChildren();const special=filtered.filter(row=>row.specialReason);if(special.length){const ul=document.createElement('ul');special.forEach(row=>{const li=document.createElement('li');li.textContent=`${row.specialReason} (${yen(Number(row.specialAmount)||0)})`;ul.appendChild(li)});specialReasonsList.appendChild(ul)}else{const p=document.createElement('p');p.textContent='特別給なし';specialReasonsList.appendChild(p)}}
function showTotalSalary(){const result=summarize(getData());document.getElementById('total-salary-display').innerHTML=`<p><strong>${yen(result.total)}</strong></p>${result.missing?`<p class="rate-hint">※単価未設定の日が${result.missing}件あります。</p>`:''}`}
function showCurrentRate(){const today=new Date().toLocaleDateString('sv-SE');const rate=rateFor(today);const el=document.getElementById('current-rate');if(!rate){el.textContent='現在適用できる単価がありません。';return}el.innerHTML=`<p>通常コマ給：<strong>${yen(rate.periodRate)}／コマ</strong></p><p>超過給：<strong>${yen(rate.periodRate*1.25)}</strong></p><p>事務時給：<strong>${yen(rate.officeHourlyRate)}／時間</strong></p><p class="rate-hint">適用開始日：${rate.startDate}（過去の勤務は当時の単価で計算）</p>`}
yearSelect.addEventListener('change',()=>{renderMonthPicker();display.replaceChildren();specialReasonsList.replaceChildren()});
updateYearSelect();showTotalSalary();showCurrentRate();
document.getElementById('today').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
</script>
</body></html>
