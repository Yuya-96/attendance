<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>打刻編集</title>

<meta content="width=device-width, initial-scale=1" name="viewport"/><link href="style.css" rel="stylesheet"/></head>
<body><meta content="width=device-width, initial-scale=1" name="viewport"/><link href="style.css" rel="stylesheet"/></head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">
      <img src="meiko.ico" alt="ロゴ">
    </span>
    出退勤システム
  </div><div class="nav-label">WORKSPACE</div><a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>ホーム</a><a class="nav-link" href="input.html"><span class="nav-icon">＋</span>打刻入力</a><a class="nav-link active" href="list.html"><span class="nav-icon">▦</span>勤怠一覧</a><a class="nav-link" href="salary.html"><span class="nav-icon">◈</span>給与確認</a><div class="sidebar-foot">ATTENDANCE SYSTEM<br/>Personal workspace</div></aside><div class="app-main"><header class="topbar"><div class="topbar-title">打刻編集</div><div class="topbar-date" id="today"></div></header><main class="content"><div class="eyebrow">WORKSPACE</div><h1>打刻編集</h1><p class="subtitle">登録済みの勤務内容を変更します。</p><div class="panel form-card">
<p>日付: <span id="date"></span></p>
<label>出勤コマ（カンマ区切り）: <input id="periods" type="text"/></label>
<label>事務時間（分）: <input id="officeMinutes" type="number"/></label>
<br>
<button id="saveBtn">保存</button>
<button id="deleteBtn">削除</button>
<a href="list.html">一覧に戻る</a>
</br></div></main></div><script>
    const params = new URLSearchParams(window.location.search);
    const date = params.get('date');

    const data = JSON.parse(localStorage.getItem('attendance') || '[]');
    const recordIndex = data.findIndex(entry => entry.date === date);
    const record = data[recordIndex];

    if (!record) {
      alert('該当する打刻データが見つかりません。');
      location.href = 'list.html';
    }

    document.getElementById('date').textContent = record.date;
    document.getElementById('periods').value = record.periods.join(', ');
    document.getElementById('officeMinutes').value = record.officeMinutes;

    document.getElementById('saveBtn').onclick = () => {
      record.periods = document.getElementById('periods').value.split(',').map(s => s.trim());
      record.officeMinutes = parseInt(document.getElementById('officeMinutes').value);
      data[recordIndex] = record;
      localStorage.setItem('attendance', JSON.stringify(data));
      alert('保存しました');
      location.href = 'list.html';
    };

    document.getElementById('deleteBtn').onclick = () => {
      if (confirm('この打刻データを削除しますか？')) {
        data.splice(recordIndex, 1);
        localStorage.setItem('attendance', JSON.stringify(data));
        alert('削除しました');
        location.href = 'list.html';
      }
    };
  </script><script>document.getElementById('today').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());</script></body>
</html>
