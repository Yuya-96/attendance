<!DOCTYPE html>

<html lang="ja">
<head>
<link href="meiko.png" rel="icon" type="image/x-icon"/>
<link href="meiko.png" rel="apple-touch-icon"/> 
  <link href=""meiko.ico"" rel=""icon""/>
<meta charset="utf-8"/>
<title>勤怠打刻システム - メニュー</title>

<meta content="width=device-width, initial-scale=1" name="viewport"/><link href="style.css" rel="stylesheet"/></head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <img src="meiko.ico" alt="ロゴ">
      </span>
      <span class="brand-text">出退勤システム</span>
    </div><div class="nav-label">WORKSPACE</div><a class="nav-link active" href="index.html"><span class="nav-icon">⌂</span>ホーム</a><a class="nav-link" href="input.html"><span class="nav-icon">＋</span>打刻入力</a><a class="nav-link" href="list.html"><span class="nav-icon">▦</span>勤怠一覧</a><a class="nav-link" href="salary.html"><span class="nav-icon">◈</span>給与確認</a><div class="sidebar-foot">ATTENDANCE SYSTEM<br/>Personal workspace</div></aside><div class="app-main"><header class="topbar"><div class="topbar-title">ダッシュボード</div><div class="topbar-date" id="today"></div></header><main class="content"><div class="eyebrow">WORKSPACE</div><h1>ダッシュボード</h1><p class="subtitle">勤務状況をひと目で確認できます。</p><div class="stats"><div class="stat"><div class="stat-label">今月の勤務日数</div><div class="stat-value" id="days">0<span style="font-size:14px"> 日</span></div><div class="stat-note">今月の登録実績</div></div><div class="stat"><div class="stat-label">今月の出勤コマ</div><div class="stat-value" id="period-count">0</div><div class="stat-note">登録された授業コマ</div></div><div class="stat"><div class="stat-label">今月の事務時間</div><div class="stat-value" id="minutes">0<span style="font-size:14px"> 分</span></div><div class="stat-note">登録された事務作業</div></div><div class="stat"><div class="stat-label">登録データ</div><div class="stat-value" id="records">0</div><div class="stat-note">全期間の記録件数</div></div></div><h2 class="section-heading">クイックアクセス</h2><div class="quick-grid"><a class="quick-card" href="input.html"><span class="quick-icon">＋</span><div class="quick-title">打刻入力 →</div><div class="quick-desc">勤務コマ・事務時間・特別給を記録</div></a><a class="quick-card" href="list.html"><span class="quick-icon">▦</span><div class="quick-title">勤怠一覧 →</div><div class="quick-desc">月別の勤務履歴を表示・編集</div></a><a class="quick-card" href="salary.html"><span class="quick-icon">◈</span><div class="quick-title">給与確認 →</div><div class="quick-desc">月別給与と全期間の給与を確認</div></a></div><section class="panel"><h2>最近の勤務履歴</h2><div id="recent"></div></section></main></div><script>(function(){let d=[];try{d=JSON.parse(localStorage.getItem('attendance')||'[]')}catch(e){};const now=new Date(),month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');const m=d.filter(r=>r.date&&r.date.startsWith(month));document.getElementById('days').textContent=new Set(m.map(r=>r.date)).size+' 日';document.getElementById('period-count').textContent=m.reduce((a,r)=>a+(r.periods||[]).length,0);document.getElementById('minutes').textContent=m.reduce((a,r)=>a+(Number(r.officeMinutes)||0),0)+' 分';document.getElementById('records').textContent=d.length;const recent=document.getElementById('recent');const rows=d.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);if(!rows.length){recent.textContent='まだ勤務記録がありません。打刻入力から登録できます。';return}const t=document.createElement('table');t.innerHTML='<thead><tr><th>日付</th><th>出勤コマ</th><th>事務時間</th></tr></thead>';const tb=document.createElement('tbody');rows.forEach(r=>{let tr=document.createElement('tr');[r.date,(r.periods||[]).join('・')||'—',(Number(r.officeMinutes)||0)+' 分'].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});t.appendChild(tb);recent.appendChild(t)})();</script><script>document.getElementById('today').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());</script></body>
</html>
