<!DOCTYPE html>

<html lang="ja">
<head>
<link href="meiko.png" rel="icon" type="image/x-icon"/>
<link href="meiko.png" rel="apple-touch-icon"/>
<meta charset="utf-8"/>
<title>打刻入力</title>

<meta content="width=device-width, initial-scale=1" name="viewport"/><link href="style.css" rel="stylesheet"/></head>
<body><meta content="width=device-width, initial-scale=1" name="viewport"/><link href="style.css" rel="stylesheet"/></head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">
      <img src="meiko.ico" alt="ロゴ">
    </span>
    出退勤システム
  </div><div class="nav-label">WORKSPACE</div><a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>ホーム</a><a class="nav-link active" href="input.html"><span class="nav-icon">＋</span>打刻入力</a><a class="nav-link" href="list.html"><span class="nav-icon">▦</span>勤怠一覧</a><a class="nav-link" href="salary.html"><span class="nav-icon">◈</span>給与確認</a><div class="sidebar-foot">ATTENDANCE SYSTEM<br/>Personal workspace</div></aside><div class="app-main"><header class="topbar"><div class="topbar-title">打刻入力</div><div class="topbar-date" id="today"></div></header><main class="content"><div class="eyebrow">WORKSPACE</div><h1>打刻入力</h1><p class="subtitle">勤務内容を入力して記録します。</p><div class="panel form-card">
<form id="attendance-form">
<label>日付: <input name="date" required="" type="date"/></label><br><br/>
<label>出勤コマ:</label><br/>
<label><input name="periods" type="checkbox" value="1"/>1限</label>
<label><input name="periods" type="checkbox" value="2"/>2限</label>
<label><input name="periods" type="checkbox" value="3"/>3限</label>
<label><input name="periods" type="checkbox" value="4"/>4限</label>
<label><input name="periods" type="checkbox" value="5"/>5限</label>
<label><input name="periods" type="checkbox" value="6"/>6限</label><br/><br/>
<label>事務作業時間（分）: <input min="0" name="office_minutes" type="number"/></label><br/><br/>
<label>特別給の理由: <input name="special_reason" placeholder="例：臨時会議" type="text"/></label><br/><br/>
<label>特別給の額（円）: <input min="0" name="special_amount" type="number"/></label><br/><br/>
<button type="submit">打刻する</button>
</br></form>
<br/>
<a href="index.html">メニューに戻る</a>
</div></main></div><script>
    document.getElementById('attendance-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const date = new Date(formData.get('date')).toISOString().split('T')[0];
      const periods = formData.getAll('periods');
      const officeMinutes = parseInt(formData.get('office_minutes') || '0', 10);
      const specialReason = formData.get('special_reason') || '';
      const specialAmount = parseInt(formData.get('special_amount') || '0', 10);

      const data = JSON.parse(localStorage.getItem('attendance') || '[]');
      data.push({ date, periods, officeMinutes, specialReason, specialAmount });
      localStorage.setItem('attendance', JSON.stringify(data));

      alert("打刻完了しました");
      this.reset();
    });
  </script><script>document.getElementById('today').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());</script></body>
</html>
