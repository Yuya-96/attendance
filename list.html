<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>勤怠一覧</title>

<meta content="width=device-width, initial-scale=1" name="viewport"/><link href="style.css" rel="stylesheet"/></head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">
      <img src="meiko.ico" alt="ロゴ">
    </span>
    出退勤システム
  </div><div class="nav-label">WORKSPACE</div><a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>ホーム</a><a class="nav-link" href="input.html"><span class="nav-icon">＋</span>打刻入力</a><a class="nav-link active" href="list.html"><span class="nav-icon">▦</span>勤怠一覧</a><a class="nav-link" href="salary.html"><span class="nav-icon">◈</span>給与確認</a><div class="sidebar-foot">ATTENDANCE SYSTEM<br/>Personal workspace</div></aside><div class="app-main"><header class="topbar"><div class="topbar-title">勤怠一覧</div><div class="topbar-date" id="today"></div></header><main class="content"><div class="eyebrow">WORKSPACE</div><h1>勤怠一覧</h1><p class="subtitle">過去の勤務記録を確認できます。</p><div class="panel">
<label>年を選択:
    <select id="year-select"></select>
</label>
<div id="month-picker"></div>
<table>
<thead><tr><th>日付</th><th>出勤コマ</th><th>事務時間（分）</th><th>備考</th><th>編集</th></tr></thead>
<tbody id="attendance-body"></tbody>
</table>
<br>
<a href="index.html">メニューに戻る</a>
</br></div></main></div><script>
    const yearSelect = document.getElementById('year-select');
    const monthPicker = document.getElementById('month-picker');
    const tbody = document.getElementById('attendance-body');
    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    function getYearsWithData() {
      const data = JSON.parse(localStorage.getItem('attendance') || '[]');
      const years = new Set();
      data.forEach(entry => years.add(entry.date.split('-')[0]));
      return Array.from(years).sort();
    }

    function updateYearSelect() {
      const years = getYearsWithData();
      yearSelect.innerHTML = '';
      years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
      });
      if (years.includes(new Date().getFullYear().toString())) {
        yearSelect.value = new Date().getFullYear();
      }
      renderMonthPicker();
    }

    yearSelect.addEventListener('change', renderMonthPicker);
    updateYearSelect();

    function renderMonthPicker() {
      const selectedYear = yearSelect.value;
      monthPicker.innerHTML = '';
      const table = document.createElement('table');
      const header = document.createElement('thead');
      header.innerHTML = `<tr><th colspan="3">${selectedYear}</th></tr>`;
      table.appendChild(header);

      const tbodyPicker = document.createElement('tbody');
      for (let i = 0; i < 4; i++) {
        const row = document.createElement('tr');
        for (let j = 0; j < 3; j++) {
          const m = i * 3 + j;
          const cell = document.createElement('td');
          cell.className = 'month';
          cell.textContent = months[m];
          cell.dataset.value = `${selectedYear}-${String(m + 1).padStart(2, '0')}`;
          cell.onclick = () => showAttendance(cell.dataset.value);
          row.appendChild(cell);
        }
        tbodyPicker.appendChild(row);
      }
      table.appendChild(tbodyPicker);
      monthPicker.appendChild(table);
    }

    function showAttendance(month) {
      const data = JSON.parse(localStorage.getItem('attendance') || '[]');
      const filtered = data.filter(row => row.date.startsWith(month));
      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

      tbody.innerHTML = '';
      filtered.forEach(row => {
        const tr = document.createElement('tr');
        const remarks = [];
        if (row.isHelp && row.helpLocation) {
          remarks.push(`ヘルプ ${row.helpLocation}`);
        }
        if (row.specialReason) {
          remarks.push(`詳細：${row.specialReason}`);
        }
        const values = [
          row.date,
          (row.periods || []).join(', '),
          row.officeMinutes,
          remarks.join(' / ') || '—'
        ];
        values.forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        });
        const editCell = document.createElement('td');
        const editButton = document.createElement('button');
        editButton.textContent = '編集';
        editButton.onclick = () => location.href = `edit.html?date=${encodeURIComponent(row.date)}`;
        editCell.appendChild(editButton);
        tr.appendChild(editCell);
        tbody.appendChild(tr);
      });
    }
  </script><script>document.getElementById('today').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());</script></body>
</html>
